<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>QRed — Preparing sign-in</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; min-height: 100dvh;
      display: grid; place-items: center; padding: 1.25rem; box-sizing: border-box; }
    main { max-width: 28rem; text-align: center; }
    .spinner { width: 2rem; height: 2rem; margin: 0 auto 1.5rem;
      border: .22rem solid #64748b; border-top-color: #93c5fd; border-radius: 50%;
      animation: spin 1s linear infinite; }
    h1 { font-size: 1.5rem; }
    p { color: #cbd5e1; line-height: 1.55; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
<main role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <h1>Preparing secure sign-in</h1>
  <p>QRed is preparing your document locally. This tab will open your sign-in provider automatically when ready.</p>
  <p>If the page does not advance, return to your original QRed tab and keep it open while preparation finishes.</p>
</main>
</body>
</html>
