<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>QRed — Preparing sign-in</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; min-height: 100dvh;
      display: grid; place-items: center; padding: 1.25rem; box-sizing: border-box; }
    main { max-width: 28rem; text-align: center; }
    .spinner { width: 2rem; height: 2rem; margin: 0 auto 1.5rem;
      border: .22rem solid #64748b; border-top-color: #93c5fd; border-radius: 50%;
      animation: spin 1s linear infinite; }
    h1 { font-size: 1.5rem; }
    p { color: #cbd5e1; line-height: 1.55; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
<main role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <h1>Preparing secure sign-in</h1>
  <p>QRed is preparing your document locally. This tab will open your sign-in provider automatically when ready.</p>
  <p>If this page does not advance, return to the original QRed tab and keep it open while preparation finishes.</p>
  <p id="handoff-status"></p>
</main>
<script>
  (() => {
    // The channel identifier is random and appears only in the fragment,
    // never in the HTTP request or in the eventual provider redirect.
    const token = location.hash.slice(1);
    const status = document.getElementById("handoff-status");
    if (!/^[a-f0-9]{32}$/.test(token) || typeof BroadcastChannel !== "function") {
      status.textContent = "Could not connect to QRed. Return to the original tab to continue sign-in.";
      return;
    }
    const channel = new BroadcastChannel("qred-auth-pending-" + token);
    const validProviderUrl = (provider, input) => {
      let url;
      try { url = new URL(input); } catch { return false; }
      if (url.protocol !== "https:" || url.username || url.password || url.hash) return false;
      if (provider === "google") return url.origin === "https://accounts.google.com" && url.pathname === "/o/oauth2/v2/auth";
      if (provider === "microsoft") return url.origin === "https://login.microsoftonline.com" && url.pathname === "/common/oauth2/v2.0/authorize";
      if (provider === "amazon") return url.origin === "https://www.amazon.com" && url.pathname === "/ap/oa";
      return false;
    };
    channel.onmessage = ({ data }) => {
      if (data?.type === "cancel") {
        channel.close();
        status.textContent = "Sign-in was cancelled in QRed. You can close this tab.";
        try { window.close(); } catch { /* The browser may keep this tab open. */ }
        return;
      }
      if (data?.type !== "authorize") return;
      if (!validProviderUrl(data.provider, data.url)) {
        status.textContent = "QRed rejected an unexpected sign-in address. Return to the original tab.";
        return;
      }
      const url = data.url;
      channel.close();
      location.replace(url);
    };
    // A ready handshake guarantees that QRed never sends the provider URL
    // before this tab has installed its listener. It also works with opener
    // isolation and on Chrome when the original tab resumes from suspension.
    channel.postMessage({ type: "ready" });
    window.addEventListener("pageshow", () => channel.postMessage({ type: "ready" }));
  })();
</script>
</body>
</html>
