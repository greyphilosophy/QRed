name: Live QRed smoke probe (isolated branch)
on:
  push:
    branches: [test/live-qred-smoke-20261027]
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Test production QRed public URLs without credentials
        run: |
          python - <<'PY'
          import json, sys, urllib.request, urllib.error

          BASE = "https://qred.org"
          fail = []
          def get(path, method="GET", data=None, headers=None):
              url = BASE + path
              req = urllib.request.Request(url, method=method, data=data, headers={"User-Agent": "QRed-Live-Smoke-GithubActions/1.0", **(headers or {})})
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      status = resp.status
                      text = resp.read(100_000).decode("utf-8", "replace")
                      content_type = resp.headers.get("content-type", "")
                      effective = resp.url
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  text = exc.read(100_000).decode("utf-8", "replace")
                  content_type = exc.headers.get("content-type", "")
                  effective = exc.url
              except Exception as exc:
                  print(f"{path}: NETWORK ERROR: {type(exc).__name__}: {exc}")
                  fail.append(path + ": network error")
                  return 0, None
              print(f"{path}: HTTP {status}; content-type={content_type}; final={effective}; body-prefix={text[:170]!r}")
              return status, text

          status, html = get("/")
          if status != 200 or not html or "QRed" not in html:
              fail.append("Home page should serve QRed HTML")
          status, html = get("/verify.htm")
          if status != 200 or not html or "QRed" not in html:
              fail.append("Verification page should serve QRed HTML")
          status, data = get("/api/keys/default")
          try:
              keys = json.loads(data or "")
              print("Public key API format:", sorted(keys.keys()))
              if status != 200 or not keys.get("key_id") or not keys.get("public_key"):
                  fail.append("Public key API not working")
          except Exception:
              fail.append("Public key API returned non-JSON")

          # Diagnostic: report only the four public provider availability booleans.
          # Never request or print Cloudflare secrets, OAuth tokens or session cookies.
          status, data = get("/api/auth/config")
          try:
              auth = json.loads(data or "")
              print("Reported provider availability:", json.dumps(auth, sort_keys=True))
              if status != 200 or any(not isinstance(auth.get(k), bool) for k in ("google", "microsoft", "meta", "amazon")):
                  fail.append("Authentication config missing or invalid")
              if auth.get("microsoft") is not True:
                  fail.append("Microsoft authentication is NOT configured on the live worker")
          except Exception:
              fail.append("Authentication config returned non-JSON")
          status, data = get("/api/auth/microsoft/complete")
          if status != 405:
              fail.append("Microsoft SPA completion route not active (expected HTTP 405 on GET)")
          status, data = get("/api/auth/microsoft/callback")
          if status != 403:
              fail.append("Microsoft callback should reject missing state (expected HTTP 403)")
          status, data = get("/api/auth/microsoft/start", method="POST",
              data=b'{"commitments":[]}',
              headers={"Origin": BASE, "Content-Type": "application/json"})
          if status != 400:
              fail.append("Microsoft start should reject missing page commitments (expected HTTP 400)")
          print("")
          if fail:
              print("LIVE SMOKE FAILURES:", json.dumps(fail, indent=2))
              sys.exit(1)
          print("LIVE SMOKE PASS: public pages and authentication endpoints respond as expected")
          PY

      - name: Verify live Microsoft PKCE start, pending session, and cancellation
        run: |
          python - <<'PY'
          import base64, http.cookiejar, json, urllib.request, urllib.parse, urllib.error
          origin = "https://qred.org"
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          def post(path, body):
              req = urllib.request.Request(origin + path, method="POST",
                  data=json.dumps(body).encode("utf-8"),
                  headers={"Origin": origin, "Content-Type": "application/json",
                           "User-Agent": "QRed-Live-Smoke-GithubActions/1.0"})
              try:
                  with opener.open(req, timeout=15) as resp:
                      return resp.status, json.loads(resp.read())
              except urllib.error.HTTPError as exc:
                  return exc.code, json.loads(exc.read())
          synthetic_commitment = base64.urlsafe_b64encode(bytes(32)).decode("ascii").rstrip("=")
          code, started = post("/api/auth/microsoft/start", {"commitments": [synthetic_commitment]})
          if code != 200:
              raise AssertionError(f"Microsoft start failed: HTTP {code}; error={started.get('error')!r}")
          assert len(started["id"]) == 43 and len(started["secret"]) == 43
          assert len(jar) > 0, "Expected short-lived authenticated session cookie"
          assert all(cookie.secure for cookie in jar), "Session cookie must be secure"
          url = urllib.parse.urlparse(started["authorize_url"])
          q = urllib.parse.parse_qs(url.query)
          assert url.scheme == "https" and url.hostname == "login.microsoftonline.com"
          assert q["redirect_uri"] == [origin + "/api/auth/microsoft/callback"]
          assert q["client_id"] == ["50e418de-6982-4d0f-a513-8c8139b4ea4f"]
          assert q["response_type"] == ["code"]
          assert q["code_challenge_method"] == ["S256"]
          assert q["scope"] == ["openid email profile"]
          assert len(q["code_challenge"][0]) == 43
          print("Microsoft start: HTTP 200, correct Azure SPA client ID, redirect, PKCE S256, encrypted session cookie")
          creds = {"id": started["id"], "secret": started["secret"]}
          code, status = post("/api/auth/microsoft/status", creds)
          assert code == 200 and status["status"] == "pending", (code, status)
          print("Microsoft status: HTTP 200 pending, bound to original authenticated browser session")
          code, result = post("/api/auth/microsoft/finish", creds)
          assert code == 200 and result["finished"] is True, (code, result)
          print("Microsoft finish: HTTP 200, cancelled cleanly")
          code, result = post("/api/auth/microsoft/status", creds)
          assert code == 403, (code, result)
          print("Microsoft session after cancellation: HTTP 403; cookies were cleared; no document or sign-in credentials sent")
          print("LIVE AUTH START/CANCEL SMOKE PASS")
          PY

      - name: Diagnose live Meta configuration and return-tab session with synthetic consent denial
        run: |
          python - <<'PY'
          import base64, http.cookiejar, json, urllib.parse, urllib.request, urllib.error
          origin = "https://qred.org"
          jar = http.cookiejar.CookieJar()
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          headers = {"User-Agent": "QRed-Meta-Cookie-Probe/1.0", "Cache-Control": "no-cache"}
          def get(path):
              request = urllib.request.Request(origin + path, headers=headers)
              try:
                  with client.open(request, timeout=15) as response:
                      return response.status, response.read(10000).decode("utf-8", "replace")
              except urllib.error.HTTPError as error:
                  return error.code, error.read(10000).decode("utf-8", "replace")
          def post(path, payload):
              request = urllib.request.Request(origin + path, method="POST",
                  data=json.dumps(payload).encode(), headers={**headers, "Origin": origin,
                      "Content-Type": "application/json"})
              try:
                  with client.open(request, timeout=15) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as error:
                  return error.code, json.loads(error.read())

          code, body = get("/api/auth/config")
          assert code == 200
          availability = json.loads(body)
          print("LIVE CONFIG:", json.dumps(availability, sort_keys=True))
          if availability.get("meta") is not True:
              print("META DIAGNOSIS: Meta is not fully configured in the active production Worker.")
              raise SystemExit(1)

          # This synthetic callback uses a *denied consent* query. It does not
          # contact Facebook, exchange a token, or sign a document. Never log
          # session IDs, session secrets, cookies or callback query strings.
          fingerprint = base64.urlsafe_b64encode(bytes(32)).decode().rstrip("=")
          code, start = post("/api/auth/meta/start", {"commitments": [fingerprint]})
          assert code == 200, ("Meta start failed", code, start.get("error"))
          assert len(start["id"]) == 43 and len(start["secret"]) == 43
          assert any(c.name.startswith("__Host-qred-meta-request-") for c in jar)
          print("META START: HTTP 200; encrypted request cookie present")
          creds = {"id": start["id"], "secret": start["secret"]}
          code, status = post("/api/auth/meta/status", creds)
          assert code == 200 and status.get("status") == "pending", (code, status)
          print("META STATUS BEFORE CALLBACK: pending")

          callback_path = "/api/auth/meta/callback?" + urllib.parse.urlencode({
              "state": start["id"], "error": "access_denied"})
          code, html = get(callback_path)
          assert code == 200, ("Meta callback rejected pending cookie", code)
          assert "Sign-in could not be completed" in html
          assert "window.close()" not in html
          print("META CALLBACK: HTTP 200 with visible failure; callback cookie accepted")
          code, after = post("/api/auth/meta/status", creds)
          assert code == 200 and after.get("status") == "failed", (code, after.get("status"))
          print("META STATUS AFTER CALLBACK: failed (not indefinitely pending)")
          code, finish = post("/api/auth/meta/finish", creds)
          assert code == 200 and finish.get("finished") is True
          print("META SESSION: cleared successfully; no real Facebook account or document used")
          PY

      - name: Verify newly published Meta policy pages and network diagram
        run: |
          python - <<'PY'
          import sys, urllib.request, urllib.error
          from html.parser import HTMLParser

          base = "https://qred.org"
          pages = {
              "/privacy.html": "Privacy Policy",
              "/data-deletion.html": "User Data Deletion",
              "/terms.html": "Terms of Service",
              "/security.html": "Security & Architecture",
          }
          failures = []
          class PageScanner(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = False
                  self.title_text = ""
                  self.links = set()
              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag == "title": self.title = True
                  if tag == "a" and data.get("href"): self.links.add(data["href"])
              def handle_endtag(self, tag):
                  if tag == "title": self.title = False
              def handle_data(self, data):
                  if self.title: self.title_text += data

          for path, title in pages.items():
              url = base + path
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "QRed-policy-live-smoke/1.0"}), timeout=15) as r:
                      status, kind, content = r.status, r.headers.get("Content-Type", ""), r.read(200000).decode("utf-8", "replace")
                  scan = PageScanner()
                  scan.feed(content)
                  links_ok = all(p in scan.links for p in pages)
                  ok = status == 200 and "text/html" in kind and title in scan.title_text and links_ok
                  print(f"{path}: HTTP {status} | title={scan.title_text!r} | links={links_ok} | {'PASS' if ok else 'FAIL'}")
                  if not ok: failures.append(path)
                  if path == "/security.html" and 'src="/qred-network-data-flow.svg"' not in content:
                      failures.append("security diagram inclusion missing")
                  if path == "/data-deletion.html" and "greyphilosophy@gmail.com" not in content:
                      failures.append("Meta data-deletion contact missing")
              except Exception as exc:
                  print(f"{path}: ERROR {type(exc).__name__}: {exc}")
                  failures.append(path)

          for path, marker, mime in [
              ("/qred-network-data-flow.svg", "<svg", "image/svg+xml"),
              ("/legal.css", ".site-header", "text/css"),
          ]:
              try:
                  with urllib.request.urlopen(urllib.request.Request(base+path, headers={"User-Agent": "QRed-policy-live-smoke/1.0", "Accept": "*/*"}), timeout=15) as r:
                      status, kind, content = r.status, r.headers.get("content-type",""), r.read(100000).decode("utf-8","replace")
                  ok = status == 200 and mime in kind and marker in content
                  print(f"{path}: HTTP {status} | type={kind} | {'PASS' if ok else 'FAIL'}")
                  if not ok: failures.append(path)
              except Exception as exc:
                  print(f"{path}: ERROR {type(exc).__name__}: {exc}")
                  failures.append(path)
          if failures:
              print("LIVE POLICY TEST FAILURES:", failures)
              sys.exit(1)
          print("LIVE POLICY PAGES AND DIAGRAM: PASS")
          PY

      - name: Verify deployed standard Facebook OAuth authorization request and session cleanup
        run: |
          python - <<'PY'
          import base64, http.cookiejar, json, urllib.parse, urllib.request, urllib.error

          origin = "https://qred.org"
          cookiejar = http.cookiejar.CookieJar()
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookiejar))
          def post(path, payload):
              req = urllib.request.Request(origin + path, method="POST",
                  data=json.dumps(payload).encode(),
                  headers={"Origin": origin, "Content-Type": "application/json",
                           "User-Agent": "QRed-live-Meta-smoke/1.0"})
              try:
                  with client.open(req, timeout=15) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  return exc.code, json.loads(exc.read())

          digest = base64.urlsafe_b64encode(bytes(32)).decode().rstrip("=")
          code, started = post("/api/auth/meta/start", {"commitments": [digest]})
          if code != 200:
              raise AssertionError(f"Meta start refused: HTTP {code}, reason={started.get('error')}")
          assert len(started["id"]) == 43 and len(started["secret"]) == 43
          assert cookiejar and all(c.secure for c in cookiejar)
          parsed = urllib.parse.urlsplit(started["authorize_url"])
          params = urllib.parse.parse_qs(parsed.query)
          assert parsed.scheme == "https" and parsed.hostname == "www.facebook.com"
          assert parsed.path.endswith("/dialog/oauth"), parsed.path
          assert params.get("client_id") == ["2087701785187116"]
          assert params.get("redirect_uri") == [origin + "/api/auth/meta/callback"]
          assert params.get("response_type") == ["code"]
          assert set(params.get("scope", [""])[0].split(",")) == {"public_profile","email"}
          assert len(params.get("state", [""])[0]) == 43
          for disallowed in ["nonce", "code_challenge", "code_challenge_method", "display", "auth_type"]:
              assert disallowed not in params, f"Unsupported Meta parameter still deployed: {disallowed}"
          print("LIVE META AUTHORIZE PASS: HTTP 200; expected QRed App ID, redirect and scope; no unsupported PKCE/nonce/desktop-popup fields")
          creds = {"id": started["id"], "secret": started["secret"]}
          code, status = post("/api/auth/meta/status", creds)
          assert code == 200 and status["status"] == "pending", (code, status)
          code, finished = post("/api/auth/meta/finish", creds)
          assert code == 200 and finished["finished"] is True, (code, finished)
          code, result = post("/api/auth/meta/status", creds)
          assert code == 403, (code, result)
          print("LIVE META SESSION PASS: encrypted pending session, safe cancellation, subsequent access rejected")
          PY
