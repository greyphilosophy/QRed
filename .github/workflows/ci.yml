name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Install PDF rasterizer for regression tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Test frontend and rendered PDF seals
        working-directory: frontend
        run: npm test -- --exclude src/pdfWatermark.test.js --exclude src/pdfClientSeal.test.js --exclude src/pdfInputIntegrity.test.js --exclude src/pdfVisualEvidence.test.js --exclude src/qr/scanQrImage.test.js --exclude src/verifier/scanPdf.test.js
      - name: Build frontend
        working-directory: frontend
        run: npm run build:pages

  frontend-heavy-tests:
    name: Frontend heavy (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: watermark
            test_args: "src/pdfWatermark.test.js"
          - shard: pdf-and-scanning
            test_args: "src/pdfClientSeal.test.js src/pdfInputIntegrity.test.js src/pdfVisualEvidence.test.js src/qr/scanQrImage.test.js src/verifier/scanPdf.test.js"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install PDF rasterizer for regression tests
        run: |
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get install -y poppler-utils || {
              sudo apt-get update
              sudo apt-get install -y poppler-utils
            }
          fi
      - name: Run heavy frontend regression tests
        working-directory: frontend
        run: npm test -- ${{ matrix.test_args }}

  e2e-tests:
    name: E2E (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Six isolated runners retain every real-browser regression, with each
    # of the two ~69s PDF verification cases on a separate worker.
    # Newly added tests run automatically in the deployment/catch-all shard.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: pdf-home
            pytest_args: "tests/test_visual_page_seals.py::test_load_pdf_seals_on_both_verifiers_offline[chromium-/]"
          - shard: pdf-standalone
            pytest_args: "tests/test_visual_page_seals.py::test_load_pdf_seals_on_both_verifiers_offline[chromium-/verify.htm]"
          - shard: printed-visual-other
            pytest_args: "tests/test_visual_page_seals.py -k 'not test_load_pdf_seals_on_both_verifiers_offline'"
          - shard: auth-and-corrupt
            pytest_args: "tests/test_account_stateless.py tests/test_corrupt_pdf.py"
          - shard: privacy-and-photo
            pytest_args: "tests/test_network_privacy.py tests/test_photo_verification.py"
          - shard: deployment-document
            pytest_args: "tests/test_qred_deployment.py::TestPlainTextSealAndVerify tests/test_qred_deployment.py::TestMultiQrDocuments tests/test_qred_deployment.py::TestPdfTextSealing tests/test_qred_deployment.py::TestImageOnlyPdfs tests/test_qred_deployment.py::TestPdfExtractionIntegrity"
          - shard: deployment-scanning-and-new-tests
            pytest_args: "tests --ignore=tests/test_visual_page_seals.py --ignore=tests/test_account_stateless.py --ignore=tests/test_corrupt_pdf.py --ignore=tests/test_network_privacy.py --ignore=tests/test_photo_verification.py -k 'not (TestPlainTextSealAndVerify or TestMultiQrDocuments or TestPdfTextSealing or TestImageOnlyPdfs or TestPdfExtractionIntegrity)'"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install PDF rasterizer for browser regression tests
        run: |
          if ! command -v pdftoppm >/dev/null; then
            sudo apt-get install -y poppler-utils || {
              sudo apt-get update
              sudo apt-get install -y poppler-utils
            }
          fi
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium-headless-shell
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start production frontend preview
        working-directory: frontend
        run: |
          npm exec vite preview -- --host 127.0.0.1 --port 3000 &
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null 2>&1 && echo "Frontend ready" && break
            sleep 1
          done
      - name: Run E2E tests
        env:
          QRED_BASE_URL: "http://localhost:3000"
        run: pytest -v --tb=short --durations=10 ${{ matrix.pytest_args }}
