name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Install PDF rasterizer for regression tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Test frontend and rendered PDF seals
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build:pages

  e2e-tests:
    name: E2E (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Browser tests can run beside the independent frontend lint/unit/build job.
    # Printed-page/offline tests account for about half the test runtime.
    # Sharding by file preserves all cases and automatically picks up newly
    # added test files outside the printed-page suite.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: printed-page-and-offline
            pytest_args: tests/test_visual_page_seals.py
          - shard: other-browser-tests
            pytest_args: tests --ignore=tests/test_visual_page_seals.py
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install PDF rasterizer for browser regression tests
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start production frontend preview
        working-directory: frontend
        run: |
          npm exec vite preview -- --host 127.0.0.1 --port 3000 &
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null 2>&1 && echo "Frontend ready" && break
            sleep 1
          done
      - name: Run E2E tests
        env:
          QRED_BASE_URL: "http://localhost:3000"
        run: pytest -v --tb=short --durations=10 ${{ matrix.pytest_args }}
